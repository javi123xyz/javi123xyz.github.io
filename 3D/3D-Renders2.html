	<div class="scripts">
			<script>
			  const loadMoreBtn = document.getElementById("loadMore");
			  const hiddenImgs = document.querySelectorAll(".image-grid img.hidden");
			  let currentIndex = 0;
			  const itemsPerClick = 16;

			  loadMoreBtn.addEventListener("click", () => {
				for (let i = currentIndex; i < currentIndex + itemsPerClick && i < hiddenImgs.length; i++) {
				  hiddenImgs[i].classList.remove("hidden");
				}
				currentIndex += itemsPerClick;
				if (currentIndex >= hiddenImgs.length) {
				  loadMoreBtn.style.display = "none";
				}
			  });
			</script>
